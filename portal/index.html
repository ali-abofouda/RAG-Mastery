<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة RAG-Mastery التعليمية | Learning Portal</title>
    
    <!-- Google Fonts: Alexandria & Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Cairo:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- KaTeX CSS for LaTeX Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <!-- Prism.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --border-color: #334155;
            --card-bg: #1e293b;
            --code-bg: #090d16;
            --header-height: 64px;
            --sidebar-width: 340px;
            --font-main: 'Alexandria', 'Cairo', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        html.light {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #059669;
            --accent-hover: #047857;
            --accent-glow: rgba(5, 150, 105, 0.15);
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --code-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            overflow-x: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Top Progress Bar */
        #progress-bar {
            position: fixed;
            top: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            width: 0%;
            z-index: 1000;
            transition: width 0.1s ease;
        }

        /* App Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            z-index: 100;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
        }

        .brand-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            background: var(--accent-glow);
            color: var(--accent);
            border-radius: 9999px;
            border: 1px solid var(--accent);
            font-weight: 500;
        }

        .search-box {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.85rem;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .stage-group {
            margin-bottom: 8px;
        }

        .stage-header {
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s;
        }

        .stage-header:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .stage-items {
            margin-right: 12px;
            padding-right: 8px;
            border-right: 2px solid var(--border-color);
            margin-top: 4px;
        }

        .doc-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            transition: all 0.15s;
            text-decoration: none;
        }

        .doc-item:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .doc-item.active {
            background-color: var(--accent-glow);
            color: var(--accent);
            font-weight: 600;
            border-right: 2px solid var(--accent);
        }

        .doc-badge {
            font-size: 0.7rem;
            color: var(--text-muted);
            direction: ltr;
        }

        /* Main Content Container */
        main.main-content {
            margin-right: var(--sidebar-width);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-right 0.3s ease;
        }

        /* Top Bar */
        header.top-bar {
            height: var(--header-height);
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        .breadcrumbs {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumbs span.current {
            color: var(--accent);
            font-weight: 600;
        }

        .actions-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: var(--accent-glow);
        }

        /* Content Area */
        .content-body {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px 80px 24px;
        }

        /* Typography & Markdown Rendering */
        .markdown-render h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            line-height: 1.4;
        }

        .markdown-render h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 36px;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .markdown-render h3 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .markdown-render p {
            margin-bottom: 18px;
            color: var(--text-primary);
            font-size: 0.98rem;
            text-align: justify;
        }

        .markdown-render ul, .markdown-render ol {
            margin-bottom: 20px;
            padding-right: 24px;
        }

        .markdown-render li {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .markdown-render blockquote {
            border-right: 4px solid var(--accent);
            background: var(--accent-glow);
            padding: 14px 20px;
            border-radius: 0 8px 8px 0;
            margin: 20px 0;
            font-size: 0.92rem;
        }

        /* Inline Code and Code Blocks */
        code {
            font-family: var(--font-code);
            direction: ltr !important;
            unicode-bidi: isolate;
        }

        p code, li code, td code {
            background-color: var(--bg-tertiary);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
            font-weight: 500;
        }

        pre {
            background-color: var(--code-bg) !important;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            overflow-x: auto;
            margin: 20px 0;
            direction: ltr !important;
            text-align: left !important;
        }

        pre code {
            background: none !important;
            padding: 0 !important;
            font-size: 0.88rem;
            color: #f8fafc;
        }

        /* Tables */
        .markdown-render table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            font-size: 0.88rem;
            overflow-x: auto;
            display: block;
        }

        .markdown-render th, .markdown-render td {
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            text-align: right;
        }

        .markdown-render th {
            background-color: var(--bg-secondary);
            color: var(--accent);
            font-weight: 700;
        }

        .markdown-render tr:nth-child(even) {
            background-color: var(--bg-secondary);
        }

        /* Mermaid Diagrams Container */
        .mermaid {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin: 24px 0;
            display: flex;
            justify-content: center;
            overflow-x: auto;
            direction: ltr !important;
        }

        /* KaTeX math formulas */
        .katex-display {
            margin: 20px 0;
            overflow-x: auto;
            padding: 8px 0;
            direction: ltr !important;
        }

        /* Active Recall Flashcard Box */
        .active-recall-card {
            background: var(--bg-secondary);
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
        }

        .active-recall-header {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-tertiary) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Search Results Overlay */
        .search-results-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .search-results-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .search-modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-results-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .search-result-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            border: 1px solid transparent;
            transition: all 0.15s;
        }

        .search-result-item:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
        }

        .search-result-title {
            font-weight: 600;
            color: var(--accent);
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .search-result-snippet {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Responsive */
        @media (max-width: 900px) {
            aside.sidebar {
                transform: translateX(100%);
            }
            aside.sidebar.open {
                transform: translateX(0);
            }
            main.main-content {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <div id="progress-bar"></div>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <span>RAG-Mastery</span>
                    <span class="brand-badge">دليل المنهج</span>
                </div>
                <button class="icon-btn" onclick="toggleTheme()" title="تبديل المظهر">
                    <span id="theme-icon">☀️</span>
                </button>
            </div>

            <div class="search-box">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="global-search" class="search-input" placeholder="بحث في كافة الدروس... (Ctrl + K)">
                </div>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Populated dynamically via /api/tree -->
                <div class="skeleton" style="height: 40px;"></div>
                <div class="skeleton" style="height: 40px;"></div>
                <div class="skeleton" style="height: 40px;"></div>
            </nav>
        </aside>

        <!-- Main Content View -->
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs" id="breadcrumbs">
                    <span>مسار RAG</span>
                    <span>/</span>
                    <span class="current" id="breadcrumb-title">جاري التحميل...</span>
                </div>

                <div class="actions-bar">
                    <button class="icon-btn" onclick="toggleSidebarMobile()" id="mobile-toggle" style="display: none;">
                        ☰ الفهرس
                    </button>
                    <button class="icon-btn" onclick="adjustFontSize(1)" title="تكبير الخط">
                        A+
                    </button>
                    <button class="icon-btn" onclick="adjustFontSize(-1)" title="تصغير الخط">
                        A-
                    </button>
                    <button class="icon-btn" onclick="toggleActiveRecall()" id="recall-toggle-btn" title="وضع المراجعة والتذكر">
                        🧠 وضع المراجعة
                    </button>
                </div>
            </header>

            <div class="content-body">
                <article class="markdown-render" id="doc-content">
                    <div class="skeleton" style="height: 48px; width: 60%;"></div>
                    <div class="skeleton" style="height: 20px; width: 90%; margin-top: 24px;"></div>
                    <div class="skeleton" style="height: 20px; width: 85%;"></div>
                    <div class="skeleton" style="height: 20px; width: 70%;"></div>
                    <div class="skeleton" style="height: 180px; width: 100%; margin-top: 30px;"></div>
                </article>
            </div>
        </main>
    </div>

    <!-- Search Modal -->
    <div class="search-results-modal" id="search-modal" onclick="closeSearchModal(event)">
        <div class="search-results-box" onclick="event.stopPropagation()">
            <div class="search-modal-header">
                <span style="font-weight: 700;">نتائج البحث السريع</span>
                <button class="icon-btn" onclick="closeSearchModal()">✕</button>
            </div>
            <div class="search-results-list" id="search-results-list">
                <!-- Search items populated here -->
            </div>
        </div>
    </div>

    <!-- Libraries: Marked, KaTeX, Mermaid, Prism -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>

    <script>
        // State
        let currentDocPath = "";
        let currentFontSize = 16;
        let activeRecallMode = false;

        // Initialize Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: document.documentElement.classList.contains('light') ? 'default' : 'dark',
            securityLevel: 'loose'
        });

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            loadTheme();
            loadDocsTree();
            setupScrollProgress();
            setupSearchKeyboard();
        });

        // Scroll Progress
        function setupScrollProgress() {
            window.addEventListener("scroll", () => {
                const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
                const progress = totalHeight > 0 ? (window.scrollY / totalHeight) * 100 : 0;
                document.getElementById("progress-bar").style.width = progress + "%";
            });
        }

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle("dark");
            html.classList.toggle("light", !isDark);
            localStorage.setItem("theme", isDark ? "dark" : "light");
            document.getElementById("theme-icon").textContent = isDark ? "☀️" : "🌙";
            
            // Re-render Mermaid with updated theme
            mermaid.initialize({
                startOnLoad: false,
                theme: isDark ? 'dark' : 'default'
            });
            renderMermaidDiagrams();
        }

        function loadTheme() {
            const saved = localStorage.getItem("theme") || "dark";
            if (saved === "light") {
                document.documentElement.classList.remove("dark");
                document.documentElement.classList.add("light");
                document.getElementById("theme-icon").textContent = "🌙";
            }
        }

        // Font Size Adjuster
        function adjustFontSize(delta) {
            currentFontSize = Math.max(13, Math.min(22, currentFontSize + delta));
            document.getElementById("doc-content").style.fontSize = currentFontSize + "px";
        }

        // Active Recall Toggle
        function toggleActiveRecall() {
            activeRecallMode = !activeRecallMode;
            const btn = document.getElementById("recall-toggle-btn");
            btn.style.backgroundColor = activeRecallMode ? "var(--accent)" : "none";
            btn.style.color = activeRecallMode ? "#ffffff" : "var(--text-secondary)";
            
            // Highlight takeaway boxes and equations
            const blockquotes = document.querySelectorAll("blockquote, .active-recall-card");
            blockquotes.forEach(b => {
                b.style.boxShadow = activeRecallMode ? "0 0 15px var(--accent)" : "none";
            });
        }

        // Load Sidebar Tree
        async function loadDocsTree() {
            try {
                const res = await fetch("/api/tree");
                const tree = await res.json();
                renderSidebar(tree);

                // Auto-load first doc or URL param
                const urlParams = new URLSearchParams(window.location.search);
                const requestedPath = urlParams.get("doc");
                if (requestedPath) {
                    loadDocument(requestedPath);
                } else if (tree.length > 0 && tree[0].docs.length > 0) {
                    loadDocument(tree[0].docs[0].rel_path);
                }
            } catch (e) {
                console.error("Failed to load docs tree", e);
            }
        }

        function renderSidebar(tree) {
            const nav = document.getElementById("sidebar-nav");
            nav.innerHTML = "";

            tree.forEach((stage, idx) => {
                const group = document.createElement("div");
                group.className = "stage-group";

                const header = document.createElement("div");
                header.className = "stage-header";
                header.innerHTML = `
                    <span>${stage.stage_title}</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">(${stage.docs.length})</span>
                `;
                
                const itemsContainer = document.createElement("div");
                itemsContainer.className = "stage-items";

                stage.docs.forEach(doc => {
                    const item = document.createElement("a");
                    item.className = "doc-item";
                    item.dataset.path = doc.rel_path;
                    item.innerHTML = `
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${doc.title}</span>
                        <span class="doc-badge">${doc.reading_time_min} د</span>
                    `;
                    item.onclick = (e) => {
                        e.preventDefault();
                        loadDocument(doc.rel_path);
                    };
                    itemsContainer.appendChild(item);
                });

                header.onclick = () => {
                    itemsContainer.style.display = itemsContainer.style.display === "none" ? "block" : "none";
                };

                group.appendChild(header);
                group.appendChild(itemsContainer);
                nav.appendChild(group);
            });
        }

        // Load Single Document
        async function loadDocument(relPath) {
            currentDocPath = relPath;
            window.scrollTo({ top: 0, behavior: "smooth" });

            // Highlight active sidebar item
            document.querySelectorAll(".doc-item").forEach(item => {
                item.classList.toggle("active", item.dataset.path === relPath);
            });

            // Update URL query without full reload
            const url = new URL(window.location);
            url.searchParams.set("doc", relPath);
            window.history.pushState({}, "", url);

            try {
                const res = await fetch(`/api/doc?path=${encodeURIComponent(relPath)}`);
                if (!res.ok) throw new Error("Document not found");
                const data = await res.json();

                // Update Breadcrumb
                document.getElementById("breadcrumb-title").textContent = data.title;

                // Render Markdown
                renderMarkdown(data.content);
            } catch (e) {
                document.getElementById("doc-content").innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <h2 style="color: #ef4444;">تعذر تحميل المستند</h2>
                        <p style="color: var(--text-secondary); margin-top: 10px;">${e.message}</p>
                    </div>
                `;
            }
        }

        // Render Markdown, Math, Code, Mermaid
        function renderMarkdown(rawMd) {
            const container = document.getElementById("doc-content");
            
            // Custom marked options
            marked.setOptions({
                gfm: true,
                breaks: true
            });

            // Parse MD to HTML
            let html = marked.parse(rawMd);
            container.innerHTML = html;

            // Render LaTeX Math with KaTeX
            renderMathInElement(container, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
            });

            // Render Mermaid Diagrams
            renderMermaidDiagrams();

            // Highlight code blocks with Prism
            Prism.highlightAllUnder(container);
        }

        function renderMermaidDiagrams() {
            const codeBlocks = document.querySelectorAll("pre code.language-mermaid");
            codeBlocks.forEach((codeEl, i) => {
                const pre = codeEl.parentElement;
                const diagramCode = codeEl.textContent;
                
                const mermaidDiv = document.createElement("div");
                mermaidDiv.className = "mermaid";
                mermaidDiv.textContent = diagramCode;

                pre.replaceWith(mermaidDiv);
            });

            mermaid.run({
                querySelector: '.mermaid'
            });
        }

        // Search Setup
        function setupSearchKeyboard() {
            const searchInput = document.getElementById("global-search");
            
            window.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === "Escape") {
                    closeSearchModal();
                }
            });

            let debounceTimer;
            searchInput.addEventListener("input", (e) => {
                clearTimeout(debounceTimer);
                const q = e.target.value.trim();
                if (q.length < 2) return;

                debounceTimer = setTimeout(async () => {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                    const results = await res.json();
                    showSearchResults(results, q);
                }, 250);
            });
        }

        function showSearchResults(results, query) {
            const modal = document.getElementById("search-modal");
            const list = document.getElementById("search-results-list");
            list.innerHTML = "";

            if (results.length === 0) {
                list.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px;">لا توجد نتائج مطابقة لـ "${query}"</p>`;
            } else {
                results.forEach(item => {
                    const el = document.createElement("div");
                    el.className = "search-result-item";
                    el.innerHTML = `
                        <div class="search-result-title">${item.title}</div>
                        <div class="search-result-snippet">${item.matches.join(" ... ")}</div>
                    `;
                    el.onclick = () => {
                        closeSearchModal();
                        loadDocument(item.rel_path);
                    };
                    list.appendChild(el);
                });
            }

            modal.style.display = "flex";
        }

        function closeSearchModal() {
            document.getElementById("search-modal").style.display = "none";
        }

        function toggleSidebarMobile() {
            document.getElementById("sidebar").classList.toggle("open");
        }
    </script>
</body>
</html>
